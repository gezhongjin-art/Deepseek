<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek 用量面板</title>
<style>
  /* ---------- 主题变量(依据 dataviz 参考色板) ---------- */
  :root {
    color-scheme: light;
    --page: #f9f9f7;   /* 页面底色 */
    --surface: #fcfcfb; /* 卡片/图表底色 */
    --ink: #0b0b0b;    /* 主文字 */
    --ink-2: #52514e;  /* 次级文字 */
    --ink-3: #898781;  /* 弱文字/坐标轴 */
    --grid: #e1e0d9;   /* 网格线 */
    --axis: #c3c2b7;   /* 轴线 */
    --border: rgba(11,11,11,0.10);
    --s1: #2a78d6;     /* 系列1:输入 token */
    --s2: #eb6834;     /* 系列2:输出 token */
    --s3: #1baf7a;     /* 系列3:缓存 token */
    --good: #0ca30c;
    --warn: #b8860b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --ink-3: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255,255,255,0.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --warn: #c98500;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --warn: #c98500;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--page);
    color: var(--ink);
    line-height: 1.5;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 60px; }

  header.top {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
  }
  header.top h1 { font-size: 20px; margin: 0; font-weight: 650; }
  header.top .meta { color: var(--ink-3); font-size: 12px; }
  header.top button {
    background: var(--surface); color: var(--ink-2);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  header.top button:hover { border-color: var(--ink-3); }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 18px 14px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; color: var(--ink); }
  .card .hint { font-size: 12px; color: var(--ink-3); margin-top: 8px; }

  /* 余额 hero */
  .balance-hero { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .balance-hero .amount {
    font-size: 46px; font-weight: 700; line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .balance-hero .cur { font-size: 18px; color: var(--ink-2); font-weight: 500; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; padding: 3px 10px; border-radius: 999px;
  }
  .badge.ok { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
  .badge.stale { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .balance-sub { display: flex; gap: 28px; margin-top: 14px; flex-wrap: wrap; }
  .balance-sub .item .lb { font-size: 12px; color: var(--ink-3); }
  .balance-sub .item .vl { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* KPI 统计块 */
  .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .kpi .tile { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
  .kpi .tile .lb { font-size: 12px; color: var(--ink-3); }
  .kpi .tile .vl { font-size: 20px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .tile .sub { font-size: 11px; color: var(--ink-3); }

  .chartbox { position: relative; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .legend .row { display: inline-flex; align-items: center; }

  /* 模型水平条形 */
  .mbar { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .mbar .name { width: 150px; flex: 0 0 auto; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mbar .track { flex: 1; height: 18px; background: var(--grid); border-radius: 5px; overflow: hidden; position: relative; }
  .mbar .fill { height: 100%; border-radius: 5px; min-width: 2px; }
  .mbar .val { width: 150px; flex: 0 0 auto; text-align: right; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  @media (max-width: 560px) {
    .mbar .name { width: 110px; }
    .mbar .val { width: 110px; font-size: 11px; }
  }

  /* 数据表格 */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--ink-3); font-weight: 500; font-size: 12px; }
  td { font-variant-numeric: tabular-nums; }
  .tablewrap { overflow-x: auto; }

  /* 提示框 */
  .tooltip {
    position: fixed; pointer-events: none; z-index: 50;
    background: var(--ink); color: var(--page);
    font-size: 12px; padding: 8px 10px; border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,.18); max-width: 260px;
    white-space: nowrap; line-height: 1.5;
  }
  .tooltip b { font-weight: 600; }
  .empty { color: var(--ink-3); font-size: 13px; padding: 24px 0; text-align: center; }
  .foot { color: var(--ink-3); font-size: 11.5px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>DeepSeek 用量面板</h1>
      <div class="meta" id="updatedAt"></div>
    </div>
    <button id="themeBtn" type="button">切换深色</button>
  </header>

  <!-- 余额 -->
  <section class="card">
    <h2>账户余额</h2>
    <div class="balance-hero">
      <span class="amount" id="balAmount">—</span>
      <span class="cur" id="balCur"></span>
      <span class="badge ok" id="balBadge" style="display:none"></span>
    </div>
    <div class="balance-sub">
      <div class="item"><div class="lb">充值余额</div><div class="vl" id="balTopped">—</div></div>
      <div class="item"><div class="lb">赠送余额</div><div class="vl" id="balGranted">—</div></div>
      <div class="item"><div class="lb">来源</div><div class="vl" id="balSrc">—</div></div>
    </div>
    <div class="hint" id="balNote"></div>
  </section>

  <!-- 统计 -->
  <section class="kpi" id="kpi"></section>

  <!-- 每日 token 用量 -->
  <section class="card">
    <h2>每日 token 用量</h2>
    <div class="legend" id="legendTokens"></div>
    <div class="chartbox" id="chartTokens"></div>
    <div class="hint" id="tokensHint"></div>
  </section>

  <!-- 每日费用 -->
  <section class="card">
    <h2>每日费用</h2>
    <div class="chartbox" id="chartCost"></div>
    <div class="hint" id="costHint"></div>
  </section>

  <!-- 各模型 -->
  <section class="card">
    <h2>各模型用量</h2>
    <div id="models"></div>
  </section>

  <!-- 明细表 -->
  <section class="card">
    <h2>近 30 天明细</h2>
    <div class="tablewrap"><table id="detailTable"></table></div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<div class="tooltip" id="tooltip" style="display:none"></div>

<script>
"use strict";
const CNY_RATE = 7.2;  // 美元→人民币的估算汇率,仅用于参考

const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ---------- 格式化 ---------- */
function fmtTokens(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(0) + "K";
  return String(n || 0);
}
function fmtMoney(n, cny) {
  const v = cny ? n * CNY_RATE : n;
  const s = cny ? "¥" : "$";
  if (v >= 1) return s + v.toFixed(2);
  if (v >= 0.01) return s + v.toFixed(4);
  return s + v.toFixed(6);
}
function fmtNum(n) { return Number(n || 0).toLocaleString("zh-CN"); }

/* ---------- 主题切换 ---------- */
const themeBtn = $("themeBtn");
function applyTheme() {
  const t = document.documentElement.dataset.theme;
  themeBtn.textContent = (t === "dark" ? "切换浅色" : "切换深色");
}
themeBtn.addEventListener("click", () => {
  const t = document.documentElement.dataset.theme;
  document.documentElement.dataset.theme = (t === "dark") ? "light" : "dark";
  localStorage.setItem("ds-theme", document.documentElement.dataset.theme);
  applyTheme();
  render();  // 重新上色
});
(function initTheme() {
  const saved = localStorage.getItem("ds-theme");
  if (saved) document.documentElement.dataset.theme = saved;
  applyTheme();
})();

/* ---------- SVG 工具 ---------- */
const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function axisLine(svg, x1, y1, x2, y2, color, w) {
  svg.appendChild(svgEl("line", { x1, y1, x2, y2, stroke: color, "stroke-width": w || 1 }));
}
function svgText(svg, x, y, str, anchor, fill, size) {
  const t = svgEl("text", { x, y, "text-anchor": anchor || "start", fill, "font-size": size || 11, "font-family": "system-ui, Segoe UI, sans-serif" });
  t.textContent = str;
  svg.appendChild(t);
}
function barRects(svg, x, y, w, h, color, rx) {
  const r = svgEl("rect", { x, y, width: w, height: h, rx: rx || 0, fill: color });
  svg.appendChild(r);
  return r;
}

/* ---------- 悬浮提示 ---------- */
const tip = $("tooltip");
function hideTip() { tip.style.display = "none"; }
function showTipAt(x, y, html, above) {
  tip.innerHTML = html;
  tip.style.display = "block";
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let px = above ? x - tw / 2 : x + 12;
  let py = above ? y - th - 12 : y + 12;
  px = Math.max(8, Math.min(px, window.innerWidth - tw - 8));
  py = Math.max(8, Math.min(py, window.innerHeight - th - 8));
  tip.style.left = px + "px";
  tip.style.top = py + "px";
}
function showTip(html, e) { showTipAt(e.clientX, e.clientY, html, false); }
/* 绑定鼠标悬停 + 手机轻点(触摸时提示显示在手指上方) */
function bindTip(el, html) {
  el.addEventListener("mousemove", (e) => showTip(html, e));
  el.addEventListener("mouseleave", hideTip);
  el.addEventListener("touchstart", (e) => {
    if (e.touches.length) showTipAt(e.touches[0].clientX, e.touches[0].clientY, html, true);
  }, { passive: true });
}

/* ---------- 堆叠柱状图:每日 token ---------- */
function chartTokens(days) {
  const box = $("chartTokens");
  box.innerHTML = "";
  const W = Math.max(box.clientWidth || 700, 280);
  const H = 250, mL = 46, mR = 10, mT = 12, mB = 26;
  const iW = W - mL - mR, iH = H - mT - mB;
  const maxV = Math.max.apply(null, days.map(d => d.input_tokens + d.output_tokens + d.cache_tokens).concat([1]));
  const slot = iW / Math.max(days.length, 1);
  const bw = Math.min(slot * 0.7, 36);
  const y = (v) => mT + iH - (v / maxV) * iH;

  const svg = svgEl("svg", { width: W, height: H });
  // 网格 + y 轴刻度
  const TICKS = 4;
  for (let i = 0; i <= TICKS; i++) {
    const v = maxV * i / TICKS;
    const yy = y(v);
    axisLine(svg, mL, yy, W - mR, yy, css("--grid"), 1);
    svgText(svg, mL - 6, yy + 4, fmtTokens(v), "end", css("--ink-3"), 11);
  }
  // 柱子 + 悬浮
  const segs = [
    { key: "input_tokens",  name: "输入", color: css("--s1") },
    { key: "output_tokens", name: "输出", color: css("--s2") },
    { key: "cache_tokens",  name: "缓存", color: css("--s3") },
  ];
  days.forEach((d, i) => {
    const x = mL + i * slot + (slot - bw) / 2;
    let acc = 0;
    segs.forEach(s => {
      const v = d[s.key] || 0;
      if (!v) return;
      const h = (v / maxV) * iH;
      const top = y(acc + v);
      const segH = h - 2;
      barRects(svg, x, top + 2, bw, segH, s.color, 3);
      acc += v;
    });
    // 整列透明热区(放大点击/悬浮目标)
    const hit = svgEl("rect", { x: mL + i * slot, y: mT, width: slot, height: iH, fill: "transparent" });
    hit.style.cursor = "default";
    bindTip(hit, "<b>" + d.date + "</b><br>输入 " + fmtTokens(d.input_tokens) +
      " · 输出 " + fmtTokens(d.output_tokens) + "<br>缓存 " + fmtTokens(d.cache_tokens) +
      " · 合计 " + fmtTokens(d.input_tokens + d.output_tokens + d.cache_tokens) +
      "<br>请求 " + d.requests + " 次");
    svg.appendChild(hit);
  });
  // x 轴标签(稀疏)
  const step = Math.max(1, Math.ceil(days.length / 8));
  days.forEach((d, i) => {
    if (i % step === 0) svgText(svg, mL + i * slot + slot / 2, H - 8, d.date.slice(5), "middle", css("--ink-3"), 11);
  });
  axisLine(svg, mL, mT + iH, W - mR, mT + iH, css("--axis"), 1);
  box.appendChild(svg);
}

/* ---------- 柱状图:每日费用 ---------- */
function chartCost(days) {
  const box = $("chartCost");
  box.innerHTML = "";
  const W = Math.max(box.clientWidth || 700, 280);
  const H = 220, mL = 54, mR = 10, mT = 12, mB = 26;
  const iW = W - mL - mR, iH = H - mT - mB;
  const maxV = Math.max.apply(null, days.map(d => d.cost_usd).concat([0.001]));
  const slot = iW / Math.max(days.length, 1);
  const bw = Math.min(slot * 0.7, 36);
  const y = (v) => mT + iH - (v / maxV) * iH;
  const svg = svgEl("svg", { width: W, height: H });
  const TICKS = 4;
  for (let i = 0; i <= TICKS; i++) {
    const v = maxV * i / TICKS;
    axisLine(svg, mL, y(v), W - mR, y(v), css("--grid"), 1);
    svgText(svg, mL - 6, y(v) + 4, fmtMoney(v, false), "end", css("--ink-3"), 11);
  }
  days.forEach((d, i) => {
    const x = mL + i * slot + (slot - bw) / 2;
    if (d.cost_usd > 0) barRects(svg, x, y(d.cost_usd), bw, mT + iH - y(d.cost_usd), css("--s1"), 3);
    const hit = svgEl("rect", { x: mL + i * slot, y: mT, width: slot, height: iH, fill: "transparent" });
    bindTip(hit, "<b>" + d.date + "</b><br>费用 " + fmtMoney(d.cost_usd, false) +
      " ≈ " + fmtMoney(d.cost_usd, true) + "<br>请求 " + d.requests + " 次");
    svg.appendChild(hit);
  });
  const step = Math.max(1, Math.ceil(days.length / 8));
  days.forEach((d, i) => {
    if (i % step === 0) svgText(svg, mL + i * slot + slot / 2, H - 8, d.date.slice(5), "middle", css("--ink-3"), 11);
  });
  axisLine(svg, mL, mT + iH, W - mR, mT + iH, css("--axis"), 1);
  box.appendChild(svg);
}

/* ---------- 各模型水平条形 ---------- */
function renderModels(models) {
  const box = $("models");
  box.innerHTML = "";
  if (!models || !models.length) { box.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  const colors = [css("--s1"), css("--s2"), css("--s3")];
  const maxCost = Math.max.apply(null, models.map(m => m.cost_usd));
  models.slice(0, 8).forEach((m, i) => {
    const row = document.createElement("div");
    row.className = "mbar";
    const name = document.createElement("div");
    name.className = "name"; name.textContent = m.model;
    name.title = m.model;
    const track = document.createElement("div");
    track.className = "track";
    const fill = document.createElement("div");
    fill.className = "fill";
    fill.style.width = (m.cost_usd / maxCost * 100).toFixed(1) + "%";
    fill.style.background = colors[i % colors.length];
    track.appendChild(fill);
    const val = document.createElement("div");
    val.className = "val";
    val.textContent = fmtMoney(m.cost_usd, false) + "  ·  " + fmtTokens(m.input_tokens + m.output_tokens + m.cache_tokens);
    val.title = "输入 " + fmtTokens(m.input_tokens) + " · 输出 " + fmtTokens(m.output_tokens) + " · 缓存 " + fmtTokens(m.cache_tokens) + " · 请求 " + m.requests + " 次";
    row.appendChild(name); row.appendChild(track); row.appendChild(val);
    box.appendChild(row);
  });
}

/* ---------- KPI ---------- */
function renderKPI(u) {
  const s = u.summary;
  const today = new Date();
  const todayStr = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");
  const td = u.by_day.find(d => d.date === todayStr) || null;
  const tiles = [
    { lb: "今日请求", vl: td ? fmtNum(td.requests) : "0", sub: td ? ("成功 " + fmtNum(td.success)) : "" },
    { lb: "今日费用", vl: td ? fmtMoney(td.cost_usd, false) : "$0", sub: td ? ("≈ " + fmtMoney(td.cost_usd, true)) : "" },
    { lb: "累计请求", vl: fmtNum(s.requests), sub: "成功 " + fmtNum(s.success) },
    { lb: "累计费用", vl: fmtMoney(s.cost_usd, false), sub: "≈ " + fmtMoney(s.cost_usd, true) },
    { lb: "输入 token", vl: fmtTokens(s.input_tokens), sub: "全部请求累计" },
    { lb: "缓存 token", vl: fmtTokens(s.cache_tokens), sub: "命中缓存省了不少钱" },
  ];
  const kpi = $("kpi");
  kpi.innerHTML = "";
  tiles.forEach(t => {
    const div = document.createElement("div");
    div.className = "tile";
    div.innerHTML = '<div class="lb">' + t.lb + '</div><div class="vl">' + t.vl + '</div>' +
      (t.sub ? '<div class="sub">' + t.sub + "</div>" : "");
    kpi.appendChild(div);
  });
}

/* ---------- 明细表 ---------- */
function renderTable(days) {
  const t = $("detailTable");
  t.innerHTML = "";
  if (!days.length) { t.innerHTML = '<tr><td class="empty">暂无数据</td></tr>'; return; }
  const rows = days.slice(-30).reverse();
  const head = "<tr><th>日期</th><th>请求</th><th>输入</th><th>输出</th><th>缓存</th><th>费用($)</th><th>费用(¥估算)</th></tr>";
  const body = rows.map(d =>
    "<tr><td>" + d.date + "</td><td>" + d.requests + "</td><td>" + fmtTokens(d.input_tokens) +
    "</td><td>" + fmtTokens(d.output_tokens) + "</td><td>" + fmtTokens(d.cache_tokens) +
    "</td><td>" + fmtMoney(d.cost_usd, false) + "</td><td>" + fmtMoney(d.cost_usd, true) + "</td></tr>"
  ).join("");
  t.innerHTML = head + body;
}

/* ---------- 主渲染 ---------- */
function render() {
  if (!window.DASH) return;
  const D = window.DASH;

  // 余额
  const b = D.balance;
  const amt = $("balAmount"), cur = $("balCur"), badge = $("balBadge"),
        topped = $("balTopped"), granted = $("balGranted"), src = $("balSrc"), note = $("balNote");
  if (b) {
    amt.textContent = b.total_balance != null ? b.total_balance : "—";
    cur.textContent = b.currency || "";
    topped.textContent = b.topped_up_balance != null ? b.topped_up_balance + (b.currency || "") : "—";
    granted.textContent = b.granted_balance != null ? b.granted_balance + (b.currency || "") : "—";
    src.textContent = "DeepSeek 官方";
    badge.style.display = "";
    if (b.is_available) {
      badge.className = "badge ok"; badge.textContent = "✅ 可用";
    } else {
      badge.className = "badge stale"; badge.textContent = "⚠️ 不可用";
    }
    note.textContent = b.stale ? "⚠️ 本次余额查询失败,显示的是上一次成功查询的结果。" : "";
  } else {
    amt.textContent = "获取失败";
    cur.textContent = "";
    badge.style.display = "none";
    topped.textContent = "—"; granted.textContent = "—";
    src.textContent = D.balance_error || "DeepSeek 官方";
    note.textContent = D.balance_status === "error" ? "余额查询失败,请稍后再试。" : "";
  }

  // 更新时间
  $("updatedAt").textContent = "数据更新于 " + (D.updated_at || "—") + " · 由电脑上的同步脚本每小时自动刷新";

  // KPI
  renderKPI(D.usage);

  // 图表
  const days = D.usage.by_day.slice(-30);
  const lt = $("legendTokens");
  lt.innerHTML = '<span class="row"><span class="sw" style="background:' + css("--s1") + '"></span>输入</span>' +
    '<span class="row"><span class="sw" style="background:' + css("--s2") + '"></span>输出</span>' +
    '<span class="row"><span class="sw" style="background:' + css("--s3") + '"></span>缓存</span>';

  if (days.length) {
    chartTokens(days);
    chartCost(days);
    $("tokensHint").textContent = "鼠标悬停柱子可看当天明细(移动端轻点)。";
    $("costHint").textContent = "费用按 CC Switch 的 models.dev 定价估算(美元),人民币为按 1 美元≈" + CNY_RATE + " 元的估算值。";
  } else {
    $("chartTokens").innerHTML = $("chartCost").innerHTML = '<div class="empty">还没有用量记录</div>';
    $("tokensHint").textContent = $("costHint").textContent = "";
  }

  renderModels(D.usage.by_model);
  renderTable(D.usage.by_day);

  const rng = D.usage.summary.range;
  $("foot").innerHTML =
    "余额数据来自 DeepSeek 官方接口;用量数据来自你电脑上 CC Switch 的本地记录(每次请求的 token 数),费用为估算值。" +
    (rng ? " 当前统计区间:" + rng.from + " ~ " + rng.to + "。" : "") +
    " 汇率按 1 美元≈" + CNY_RATE + " 元估算,仅供参考。网页由同步脚本生成,不含你的 API Key。";
}

/* ---------- 数据加载 ---------- */
function load() {
  if (location.protocol === "file:") {
    $("updatedAt").textContent = "⚠️ 请通过 GitHub Pages 网址打开本页(直接双击打开时浏览器不允许读取数据文件)。";
    return;
  }
  fetch("data/dashboard.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(d => { window.DASH = d; render(); })
    .catch(e => {
      $("updatedAt").textContent = "数据加载失败:" + e.message + "(请确认已运行同步脚本,并把 data/dashboard.json 上传到仓库。)";
    });
}

let rzTimer = null;
window.addEventListener("resize", () => { clearTimeout(rzTimer); rzTimer = setTimeout(render, 200); });
load();
</script>
</body>
</html>
